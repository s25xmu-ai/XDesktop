name: Build XDesktop (Windows exe)

"on":
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish the portable ZIP as a prerelease'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: xdesktop-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      TBUILD: D:\TBuild
      LibrariesPath: D:\TBuild\Libraries\win64
      API_MODE: independent-server-placeholder

    steps:
      - name: Checkout this repository (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Prepare source layout and MSYS2 package fix
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:TBUILD\Libraries", "$env:TBUILD\ThirdParty", "$env:GITHUB_WORKSPACE\logs" | Out-Null
          Move-Item "$env:GITHUB_WORKSPACE\source" "$env:TBUILD\tdesktop"
          $prepare = "$env:TBUILD\tdesktop\Telegram\build\prepare\prepare.py"
          $text = Get-Content $prepare -Raw
          $old = 'mingw-w64-x86_64-diffutils'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -gt 1) { throw 'Unexpected prepare.py layout; review the diffutils patch.' }
          if ($count -eq 1) { [IO.File]::WriteAllText($prepare, $text.Replace($old, 'diffutils')) }
          $doc = Get-Content "$env:TBUILD\tdesktop\docs\building-win.md" -Raw
          $match = [regex]::Match($doc, '\*\*([0-9.]+)\*\* SDK version')
          if (!$match.Success) { throw 'Cannot determine the required Windows SDK.' }
          "SDK=$($match.Groups[1].Value)" >> $env:GITHUB_ENV
          "CACHE_KEY=$((Get-FileHash $prepare -Algorithm SHA256).Hash)-$($match.Groups[1].Value)" >> $env:GITHUB_ENV
          "SOURCE_SHA=$(git -C "$env:TBUILD\tdesktop" rev-parse HEAD)" >> $env:GITHUB_ENV
          git config --global user.name 'XDesktop CI'
          git config --global user.email 'xdesktop-ci@users.noreply.github.com'

      - name: Initialize MSVC x64 (Windows 7 compatible toolset)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: Show toolchain
        run: |
          cmake --version
          python --version
          if (!$env:VCToolsInstallDir -or !(Test-Path "$env:VCToolsInstallDir\atlmfc\include\atlbase.h")) {
            throw 'The selected MSVC 14.44 toolset needs ATL/MFC headers installed on this runner.'
          }
          Get-PSDrive D | Select-Object Name, Free, Used

      - name: Configure NuGet source
        shell: cmd
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Update -Name nuget.org -Source https://api.nuget.org/v3/index.json
          if errorlevel 1 nuget sources Add -Name nuget.org -Source https://api.nuget.org/v3/index.json
          if errorlevel 1 exit /b 1

      - name: Cache third-party tools and libraries
        uses: actions/cache@v4
        with:
          path: |
            D:\TBuild\ThirdParty
            D:\TBuild\Libraries
          key: Windows-x64-xdesktop-v1-${{ env.CACHE_KEY }}
          restore-keys: Windows-x64-xdesktop-v1-

      - name: Prepare dependencies (including Release)
        shell: cmd
        run: |
          call "%TBUILD%\tdesktop\Telegram\build\prepare\win.bat" silent > "%GITHUB_WORKSPACE%\logs\prepare.log" 2>&1
          if errorlevel 1 (
            powershell -NoProfile -Command "Get-Content '%GITHUB_WORKSPACE%\logs\prepare.log' -Tail 150"
            exit /b 1
          )

      - name: Configure and build Release
        run: |
          $ErrorActionPreference = 'Stop'
          # Explicit owner-supplied placeholders, accepted only if the independent server allows them.
          $api = @('-D', 'TDESKTOP_API_TEST=OFF', '-D', 'TDESKTOP_API_ID=1234567890', '-D', 'TDESKTOP_API_HASH=1234567890')
          Set-Location "$env:TBUILD\tdesktop\Telegram"
          & .\configure.bat x64 @api -D CMAKE_CONFIGURATION_TYPES=Release -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON *> "$env:GITHUB_WORKSPACE\logs\configure.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:GITHUB_WORKSPACE\logs\configure.log" -Tail 150; throw 'Configure failed.' }
          $ram = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          $parallel = [Math]::Max(1, [Math]::Min([Environment]::ProcessorCount, [int][Math]::Floor($ram / 2.5GB)))
          & cmake --build ..\out --config Release --parallel $parallel *> "$env:GITHUB_WORKSPACE\logs\build.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:GITHUB_WORKSPACE\logs\build.log" -Tail 150; throw 'Build failed.' }

      - name: Package portable executable and checksums
        id: package
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:TBUILD\tdesktop\out\Release"
          if (!(Test-Path "$out\Telegram.exe")) { throw 'Release Telegram.exe is missing.' }
          $dist = "$env:GITHUB_WORKSPACE\dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "$out\Telegram.exe" "$dist\XDesktop.exe"
          Get-ChildItem $out -File | Where-Object { $_.Extension -eq '.dll' } | Copy-Item -Destination $dist
          Copy-Item "$env:TBUILD\tdesktop\LICENSE" $dist
          @{
            repository = $env:GITHUB_REPOSITORY
            commit = $env:SOURCE_SHA
            architecture = 'x64'
            configuration = 'Release'
            api_mode = $env:API_MODE
            dc_id = 2
            dc_ip = '193.151.158.60'
            dc_port = 2398
            rsa_fingerprint = '9092a605d9189818'
            note = 'Independent-server build. Placeholder API credentials; unsigned and not runtime-tested. Official MTProto DC fallback and emergency config discovery disabled; this is not an OS-wide network sandbox.'
          } | ConvertTo-Json | Set-Content "$dist\build-info.json"
          $short = $env:SOURCE_SHA.Substring(0, 12)
          $zip = "$env:GITHUB_WORKSPACE\XDesktop-windows-x64-$short.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $zip
          $files = @("$dist\XDesktop.exe", $zip)
          $files | ForEach-Object { $h = Get-FileHash $_ -Algorithm SHA256; "$($h.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_))" } | Set-Content "$env:GITHUB_WORKSPACE\SHA256SUMS.txt"
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "tag=xdesktop-build-$env:GITHUB_RUN_ID" >> $env:GITHUB_OUTPUT
          "### XDesktop Windows x64`n`nCommit: $env:SOURCE_SHA`n`nAPI mode: $env:API_MODE`n`nDownload the portable ZIP artifact, extract it, then run XDesktop.exe. The binary is unsigned and has not been runtime-tested by this workflow." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload executable and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: XDesktop-windows-x64-${{ github.run_id }}
          path: |
            dist/
            XDesktop-windows-x64-*.zip
            SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Redact API credentials from downloadable logs
        id: redact
        if: always()
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          $ErrorActionPreference = 'Stop'
          $values = @($env:TELEGRAM_API_ID, $env:TELEGRAM_API_HASH, $env:TDESKTOP_API_ID, $env:TDESKTOP_API_HASH) | Where-Object { $_ }
          Get-ChildItem "$env:GITHUB_WORKSPACE\logs" -File -ErrorAction SilentlyContinue | ForEach-Object {
            $text = [IO.File]::ReadAllText($_.FullName)
            foreach ($value in $values) { $text = $text.Replace($value, '[REDACTED]') }
            [IO.File]::WriteAllText($_.FullName, $text)
          }

      - name: Upload build logs after redaction
        if: ${{ always() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: XDesktop-build-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  release:
    if: ${{ inputs.create_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XDesktop-windows-x64-${{ github.run_id }}
          path: release-files
      - name: Publish optional prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xdesktop-build-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: XDesktop Windows x64 (build ${{ github.run_number }})
          prerelease: true
          body: 'Independent-server build: DC2 at 193.151.158.60:2398. Placeholder API credentials; unsigned and not runtime-tested.'
          files: |
            release-files/XDesktop-windows-x64-*.zip
            release-files/SHA256SUMS.txt
